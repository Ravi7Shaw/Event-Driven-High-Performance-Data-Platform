[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eventvault"
version = "1.0.0"
description = "Transactional asynchronous inventory and immutable event platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "asyncpg>=0.30,<1",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "websockets>=14,<17",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pip-audit>=2.8,<3"]
[project.scripts]
eventvault = "eventvault.cli:main"
[tool.setuptools.packages.find]
include = ["eventvault*"]
[tool.setuptools.package-data]
eventvault = ["migrations/*.sql"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
